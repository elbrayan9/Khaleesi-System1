<template>
  <style>
    @font-face{font-family:"Inter";font-weight:400;font-style:normal;font-display:block;src:url("assets/fonts/Inter-400.woff2") format("woff2");}
    @font-face{font-family:"Inter";font-weight:900;font-style:normal;font-display:block;src:url("assets/fonts/Inter-900.woff2") format("woff2");}

    #root{
      position:relative;
      width:1080px;
      height:1920px;
      overflow:hidden;
      font-family:"Inter",sans-serif;
      container-type:size;
    }

    .factura-bg{
      position:absolute;
      inset:0;
      background:
        radial-gradient(120% 70% at 50% 22%, rgba(37,99,235,0.16) 0%, rgba(37,99,235,0) 62%),
        #27272A;
    }
    .factura-dots{
      position:absolute;
      inset:0;
      background-image:radial-gradient(rgba(37,99,235,0.18) 2px, rgba(0,0,0,0) 2px);
      background-size:60px 60px;
      opacity:0.55;
    }

    .factura-accentline{
      position:absolute;
      left:90px;
      top:212px;
      width:120px;
      height:6px;
      border-radius:2px;
      background:#2563EB;
    }
    .factura-eyebrow{
      position:absolute;
      left:90px;
      top:252px;
      font-size:26px;
      font-weight:400;
      letter-spacing:0.14em;
      text-transform:uppercase;
      color:#60A5FA;
    }
    .factura-head{
      position:absolute;
      left:90px;
      top:300px;
      width:900px;
      font-size:104px;
      font-weight:900;
      line-height:1.06;
      letter-spacing:-0.02em;
      color:#60A5FA;
    }
    .factura-head span{display:block;}

    /* --- device / window frame holding the real product screenshot --------- */
    .factura-shot{
      position:absolute;
      left:70px;
      top:830px;
      width:940px;
      height:640px;
      border-radius:20px;
      overflow:hidden;
      border:1.5px solid rgba(37,99,235,0.30);
      box-shadow:0 34px 80px rgba(0,0,0,0.55);
      background:#18181B;
    }
    .factura-shot img{
      position:absolute;
      left:0;
      top:0;
      width:1440px;
      height:900px;
      transform-origin:0 0;
      /* crop: source rect x250 y345, 780x531, scaled 1.2051 to 940x640 */
      transform:scale(1.2051) translate(-250px, -345px);
      image-rendering:auto;
    }

    /* cobalt highlight ring around the "Cargar con camara" button */
    .factura-ring{
      position:absolute;
      left:5px;
      top:7px;
      width:247px;
      height:70px;
      overflow:visible;
    }
    .factura-ring rect{
      fill:none;
      stroke:#2563EB;
      stroke-width:5;
      stroke-linecap:round;
    }
    .factura-ring-glow{
      position:absolute;
      left:5px;
      top:7px;
      width:247px;
      height:70px;
      border-radius:14px;
      background:rgba(37,99,235,0.18);
    }

    .factura-badge{
      position:absolute;
      left:90px;
      top:1550px;
      width:900px;
      height:118px;
      border-radius:100px;
      background:rgba(37,99,235,0.15);
      border:1.5px solid rgba(37,99,235,0.20);
      display:flex;
      align-items:center;
      justify-content:center;
      gap:26px;
    }
    .factura-badge .label{
      font-size:48px;
      font-weight:900;
      letter-spacing:-0.01em;
      color:#60A5FA;
    }
    .factura-check{
      width:56px;
      height:56px;
      flex:0 0 56px;
    }
    .factura-check circle{
      fill:none;
      stroke:rgba(37,99,235,0.35);
      stroke-width:4;
    }
    .factura-check path{
      fill:none;
      stroke:#2563EB;
      stroke-width:6;
      stroke-linecap:round;
      stroke-linejoin:round;
    }
  </style>

  <div
    id="root"
    data-composition-id="04-factura"
    data-start="0"
    data-duration="4"
    data-width="1080"
    data-height="1920"
  >
    <div class="clip factura-bg" data-start="0" data-duration="4" data-track-index="0"></div>
    <div class="clip factura-dots" id="factura-dots" data-start="0" data-duration="4" data-track-index="1"></div>

    <div class="clip factura-accentline" id="factura-accentline" data-start="0" data-duration="4" data-track-index="2"></div>
    <div class="clip factura-eyebrow" id="factura-eyebrow" data-start="0" data-duration="4" data-track-index="3">Mercaderia</div>
    <div class="clip factura-head" id="factura-head" data-start="0" data-duration="4" data-track-index="4">
      <span class="factura-hl">Una foto</span>
      <span class="factura-hl">de la factura</span>
    </div>

    <div class="clip factura-shot" id="factura-shot" data-start="0" data-duration="4" data-track-index="5">
      <img src="assets/productos.png" alt="Gestion de Productos" />
      <div class="factura-ring-glow" id="factura-ringglow"></div>
      <svg class="factura-ring" id="factura-ring" viewBox="0 0 247 70">
        <rect id="factura-ringrect" x="2.5" y="2.5" width="242" height="65" rx="13"></rect>
      </svg>
    </div>

    <div class="clip factura-badge" id="factura-badge" data-start="0" data-duration="4" data-track-index="6">
      <svg class="factura-check" viewBox="0 0 56 56">
        <circle cx="28" cy="28" r="24"></circle>
        <path id="factura-checkpath" d="M16 29 L25 38 L41 19"></path>
      </svg>
      <div class="label">+ stock actualizado</div>
    </div>
  </div>

  <script>
    (function () {
      var root = document.querySelector('[data-composition-id="04-factura"]');
      var q = function (s) { return root.querySelector(s); };
      var qa = function (s) { return Array.prototype.slice.call(root.querySelectorAll(s)); };

      var tl = gsap.timeline({ paused: true });

      // --- Scene 1 (0.0-1.0s): eyebrow + rule + two-line headline land --------
      tl.fromTo(q('#factura-dots'),
        { opacity: 0 },
        { opacity: 0.55, duration: 0.6, ease: 'power1.out' }, 0);

      tl.fromTo(q('#factura-accentline'),
        { opacity: 0, scaleX: 0, transformOrigin: 'left center' },
        { opacity: 1, scaleX: 1, duration: 0.34, ease: 'power3.out' }, 0.02);

      tl.fromTo(q('#factura-eyebrow'),
        { opacity: 0, y: 16 },
        { opacity: 1, y: 0, duration: 0.34, ease: 'power2.out' }, 0.1);

      tl.fromTo(qa('.factura-hl'),
        { opacity: 0, y: 46 },
        { opacity: 1, y: 0, duration: 0.42, ease: 'power3.out', stagger: 0.14 }, 0.12);

      // --- Scene 2 (1.0-2.2s): the real screenshot rises in its window -------
      tl.fromTo(q('#factura-shot'),
        { opacity: 0, y: 150, scale: 0.965, transformOrigin: '50% 50%' },
        { opacity: 1, y: 0, scale: 1, duration: 0.85, ease: 'power3.out' }, 1.0);

      // --- Scene 3 (2.2-3.5s): ring draws on the camera button, pill springs -
      var ringRect = q('#factura-ringrect');
      var ringLen = 600;
      try { ringLen = ringRect.getTotalLength(); } catch (e) { ringLen = 600; }
      gsap.set(ringRect, { strokeDasharray: ringLen, strokeDashoffset: ringLen, opacity: 1 });
      gsap.set(q('#factura-ringglow'), { opacity: 0 });

      tl.to(ringRect, { strokeDashoffset: 0, duration: 0.6, ease: 'power2.inOut' }, 2.2);
      tl.to(q('#factura-ringglow'), { opacity: 1, duration: 0.5, ease: 'power1.out' }, 2.4);

      var checkPath = q('#factura-checkpath');
      var len = 60;
      try { len = checkPath.getTotalLength(); } catch (e) { len = 60; }
      gsap.set(checkPath, { strokeDasharray: len, strokeDashoffset: len });

      tl.fromTo(q('#factura-badge'),
        { opacity: 0, y: 34, scale: 0.92, transformOrigin: '50% 50%' },
        { opacity: 1, y: 0, scale: 1, duration: 0.48, ease: 'back.out(1.7)' }, 2.45);

      tl.to(checkPath, { strokeDashoffset: 0, duration: 0.36, ease: 'power2.out' }, 2.72);

      // very slow push-in underneath the whole back half
      tl.to(q('#factura-shot'),
        { scale: 1.035, duration: 1.3, ease: 'sine.inOut' }, 2.2);

      window.__timelines = window.__timelines || {};
      window.__timelines['04-factura'] = tl;
    })();
  </script>
</template>
