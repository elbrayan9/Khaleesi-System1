<template>
  <div id="root" data-composition-id="02-el-giro" data-width="1080" data-height="1920">
    <style>
      @font-face{font-family:"Inter";font-weight:400;font-style:normal;font-display:block;src:url("assets/fonts/Inter-400.woff2") format("woff2"),url("assets/fonts/Inter-400.ttf") format("truetype");}
      @font-face{font-family:"Inter";font-weight:900;font-style:normal;font-display:block;src:url("assets/fonts/Inter-900.woff2") format("woff2"),url("assets/fonts/Inter-900.ttf") format("truetype");}

      #root{
        position:absolute;
        inset:0;
        width:1080px;
        height:1920px;
        overflow:hidden;
        container-type:size;
        font-family:"Inter",sans-serif;
      }

      .giro-bg{
        position:absolute;
        inset:0;
        background:#27272A;
      }

      .giro-glow{
        position:absolute;
        top:790px;
        left:0;
        right:0;
        margin:0 auto;
        width:900px;
        height:560px;
        border-radius:50%;
        background:radial-gradient(closest-side, rgba(37,99,235,0.42), rgba(37,99,235,0.14) 55%, rgba(37,99,235,0) 78%);
        filter:blur(40px);
        opacity:0;
      }

      .giro-stage{
        position:absolute;
        top:560px;
        left:90px;
        width:900px;
        text-align:center;
      }

      .giro-line{
        display:block;
        font-weight:900;
        letter-spacing:-0.02em;
        line-height:1.06;
        white-space:nowrap;
      }

      .giro-line-a,
      .giro-line-b{
        font-size:150px;
        color:#60A5FA;
      }

      .giro-word{
        display:inline-block;
        margin:0 14px;
        opacity:0;
      }

      .giro-foto{
        display:inline-block;
        margin-top:34px;
        font-size:230px;
        font-weight:900;
        letter-spacing:-0.03em;
        line-height:1.0;
        color: #60A5FA;
        opacity:0;
      }
    </style>

    <div class="clip giro-bg" data-start="0" data-duration="3" data-track-index="0"></div>

    <div class="clip giro-glow" id="giro-glow" data-start="0" data-duration="3" data-track-index="1"></div>

    <div class="clip giro-stage" data-start="0" data-duration="3" data-track-index="2">
      <span class="giro-line giro-line-a">
        <span class="giro-word">¿Y</span><span class="giro-word">si</span><span class="giro-word">le</span>
      </span>
      <span class="giro-line giro-line-b">
        <span class="giro-word">sacas</span><span class="giro-word">una</span>
      </span>
      <span class="giro-foto" id="giro-foto">foto?</span>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        var root = document.querySelector('[data-composition-id="02-el-giro"]');
        var words = root.querySelectorAll('.giro-word');
        var foto = root.querySelector('#giro-foto');
        var glow = root.querySelector('#giro-glow');

        var tl = gsap.timeline({ paused: true });

        // Scene 1 (0.0-1.0s) — blur-in por palabra, la ultima palabra todavia no esta.
        tl.fromTo(words,
          { opacity: 0, filter: 'blur(26px)', y: 26 },
          { opacity: 1, filter: 'blur(0px)', y: 0, duration: 0.46, ease: 'power2.out', stagger: 0.13 },
          0.05);

        // Scene 2 (1.0-1.9s) — "foto?" cae en su lugar con scale-pop, unico color de pantalla.
        tl.fromTo(foto,
          { opacity: 0, scale: 0.6, y: -46, filter: 'blur(12px)' },
          { opacity: 1, scale: 1.06, y: 0, filter: 'blur(0px)', duration: 0.42, ease: 'back.out(2.4)' },
          1.0);
        tl.to(foto, { scale: 1, duration: 0.26, ease: 'power2.out' }, 1.42);

        // glow del acento acompanando la caida
        tl.fromTo(glow,
          { opacity: 0, scale: 0.72 },
          { opacity: 0.55, scale: 1, duration: 0.5, ease: 'power2.out' },
          1.02);

        // Scene 3 (1.9-3.0s) — quieto; solo el glow respira detras de la palabra azul.
        tl.to(glow, { opacity: 0.82, scale: 1.08, duration: 0.55, ease: 'sine.inOut' }, 1.9);
        tl.to(glow, { opacity: 0.5, scale: 0.98, duration: 0.55, ease: 'sine.inOut' }, 2.45);

        tl.set({}, {}, 3);

        window.__timelines = window.__timelines || {};
        window.__timelines['02-el-giro'] = tl;
      })();
    </script>
