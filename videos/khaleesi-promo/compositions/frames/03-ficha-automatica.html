    <script>
      (function () {
        var tl = gsap.timeline({ paused: true });

        var CAM_FULL = 3.263;          // 190px -> 620px de ancho de camara
        var CAM_FULL_X = 140;          // miniatura(90,200) -> camara(230,260)
        var CAM_FULL_Y = 60;
        var SLOT_SCALE = 0.5789;       // 190x240 -> 110x139
        var SLOT_X = 650;              // 90 -> 740 (casillero Foto: card 90 + row 40 + 610)
        var SLOT_Y = 990;              // 200 -> 1190 (card 560 + row4 610 + 20)

        // ===== Scene 1 (0.0-1.1s) — marco de camara + disparo =====
        // el marco esta presente desde t=0 (hero visible antes de 0.5s)
        tl.set('#fa-cam', { x: CAM_FULL_X, y: CAM_FULL_Y, scale: CAM_FULL }, 0);
        tl.fromTo('#fa-cam',
          { opacity: 0 },
          { opacity: 1, duration: 0.3, ease: 'power2.out' }, 0);
        // respiracion del encuadre antes del disparo
        tl.to('#fa-cam', { scale: CAM_FULL * 1.03, duration: 0.5, ease: 'sine.inOut' }, 0.28);

        // flash del obturador — muy corto
        tl.fromTo('#fa-flash',
          { opacity: 0 },
          { opacity: 0.92, duration: 0.06, ease: 'power2.out' }, 0.8);
        tl.to('#fa-flash', { opacity: 0, duration: 0.22, ease: 'power2.in' }, 0.86);

        // el marco se contrae a miniatura arriba a la izquierda
        tl.to('#fa-cam',
          { x: 0, y: 0, scale: 1, duration: 0.48, ease: 'power3.inOut' }, 0.84);

        // ===== Scene 2 (1.1-2.2s) — la ficha vacia aparece debajo =====
        tl.fromTo('#fa-card',
          { opacity: 0, y: 46 },
          { opacity: 1, y: 0, duration: 0.5, ease: 'power2.out' }, 1.12);
        tl.fromTo(['#fa-eyebrow', '#fa-mark'],
          { opacity: 0 },
          { opacity: 1, duration: 0.34, ease: 'power2.out' }, 1.3);
        tl.fromTo('#fa-rule',
          { scaleX: 0, transformOrigin: '0 50%' },
          { scaleX: 1, duration: 0.36, ease: 'power2.out' }, 1.36);
        tl.fromTo(['#fa-row-1', '#fa-row-2', '#fa-row-3', '#fa-row-4'],
          { opacity: 0, y: 18 },
          { opacity: 1, y: 0, duration: 0.34, ease: 'power2.out', stagger: 0.11 }, 1.46);
        tl.fromTo('#fa-slot',
          { opacity: 0, scale: 0.86, transformOrigin: '50% 50%' },
          { opacity: 1, scale: 1, duration: 0.34, ease: 'power2.out' }, 1.86);

        // ===== Scene 3 (2.2-3.1s) — NOMBRE se escribe solo (typewriter) =====
        tl.fromTo('#fa-caret',
          { opacity: 0 },
          { opacity: 1, duration: 0.08, ease: 'none' }, 2.2);
        tl.fromTo('#fa-value-1 .fa-char',
          { opacity: 0 },
          { opacity: 1, duration: 0.001, ease: 'none', stagger: 0.033 }, 2.28);
        tl.to('#fa-caret', { opacity: 0, duration: 0.1, ease: 'none' }, 2.86);
        tl.to('#fa-label-1', { color: '#2563EB', duration: 0.24, ease: 'power2.out' }, 2.86);
        tl.fromTo('#fa-check-1',
          { opacity: 0, scale: 0.4, transformOrigin: '50% 50%' },
          { opacity: 1, scale: 1, duration: 0.38, ease: 'back.out(3)' }, 2.9);

        // ===== Scene 4 (3.1-3.9s) — CODIGO de golpe (snap) =====
        tl.fromTo('#fa-value-2',
          { opacity: 0, scale: 1.14, transformOrigin: '0 50%' },
          { opacity: 1, scale: 1, duration: 0.2, ease: 'power4.out' }, 3.16);
        tl.fromTo('#fa-barcode',
          { opacity: 0, scaleX: 0.3, transformOrigin: '0 50%' },
          { opacity: 1, scaleX: 1, duration: 0.26, ease: 'power3.out' }, 3.22);
        tl.to('#fa-label-2', { color: '#2563EB', duration: 0.24, ease: 'power2.out' }, 3.3);
        tl.fromTo('#fa-check-2',
          { opacity: 0, scale: 0.4, transformOrigin: '50% 50%' },
          { opacity: 1, scale: 1, duration: 0.38, ease: 'back.out(3)' }, 3.44);

        // ===== Scene 5 (3.9-4.7s) — CATEGORIA como pill =====
        tl.fromTo('#fa-pill',
          { opacity: 0, scale: 0.62, y: 14, transformOrigin: '0 50%' },
          { opacity: 1, scale: 1, y: 0, duration: 0.42, ease: 'back.out(2.6)' }, 3.96);
        tl.to('#fa-label-3', { color: '#2563EB', duration: 0.24, ease: 'power2.out' }, 4.1);
        tl.fromTo('#fa-check-3',
          { opacity: 0, scale: 0.4, transformOrigin: '50% 50%' },
          { opacity: 1, scale: 1, duration: 0.38, ease: 'back.out(3)' }, 4.24);

        // ===== Scene 6 (4.7-5.4s) — la miniatura viaja y encastra en FOTO =====
        tl.to('#fa-cam',
          { x: SLOT_X, y: SLOT_Y, scale: SLOT_SCALE, duration: 0.62, ease: 'power3.inOut' }, 4.72);
        tl.to('#fa-slot',
          { opacity: 0, duration: 0.2, ease: 'power2.out' }, 5.14);
        tl.to('#fa-label-4', { color: '#2563EB', duration: 0.24, ease: 'power2.out' }, 5.2);
        tl.fromTo('#fa-check-4',
          { opacity: 0, scale: 0.4, transformOrigin: '50% 50%' },
          { opacity: 1, scale: 1, duration: 0.36, ease: 'back.out(3)' }, 5.24);

        // ===== Scene 7 (5.4-6.5s) — cierre en gris, todo lo demas quieto =====
        tl.fromTo('#fa-closing',
          { opacity: 0, y: 22 },
          { opacity: 1, y: 0, duration: 0.5, ease: 'power2.out' }, 5.46);

        tl.set({}, {}, 6.5);

        window.__timelines = window.__timelines || {};
        window.__timelines['03-ficha-automatica'] = tl;
      })();
