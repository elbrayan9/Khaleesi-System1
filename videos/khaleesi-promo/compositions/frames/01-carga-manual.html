          { opacity: 1, y: 0, duration: 0.4, ease: 'power2.out' }, 0.0);

          { opacity: 0, scale: 0.86 },
          { opacity: 1, scale: 1, duration: 0.44, ease: 'back.out(2)' }, 1.36);
