<script>
(function(){
  var g = window.gsap;
  var root = document.querySelector('[data-composition-id="05-cobrar"]');

  // Deterministic, hardcoded QR-like pattern (11x11). Encodes nothing.
  var PATTERN = [
    "11100101110",
    "10100110101",
    "11101011101",
    "00001100000",
    "10110101101",
    "01011010110",
    "10110100101",
    "00001011000",
    "11101101011",
    "10100010010",
    "11101011110"
  ];
  var qr = root.querySelector('#cobrar-qr');
  var mods = [];
  for (var r = 0; r < PATTERN.length; r++) {
    for (var c = 0; c < PATTERN[r].length; c++) {
      var d = document.createElement('div');
      d.className = 'cobrar-mod' + (PATTERN[r].charAt(c) === '1' ? '' : ' off');
      qr.appendChild(d);
      mods.push(d);
    }
  }

  var checkPath = root.querySelector('#cobrar-checkpath');
  var len = 90;
  try { len = checkPath.getTotalLength(); } catch (e) {}
  g.set(checkPath, { strokeDasharray: len, strokeDashoffset: len });

  var tl = g.timeline({ paused: true });

  // Scene 1 (0.0-1.0) — eyebrow, rule, headline land upper third
  tl.fromTo('#root[data-composition-id="05-cobrar"] .cobrar-eyebrow',
    { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.42, ease: 'power3.out' }, 0.05);
  tl.fromTo('#root[data-composition-id="05-cobrar"] .cobrar-rule',
    { opacity: 0, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.4, ease: 'power3.out' }, 0.22);
  tl.fromTo('#root[data-composition-id="05-cobrar"] .cobrar-h1',
    { opacity: 0, y: 44 }, { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 0.3);
  tl.fromTo('#root[data-composition-id="05-cobrar"] .cobrar-h2',
    { opacity: 0, y: 44 }, { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 0.44);

  // Scene 2 (1.0-2.4) — 2x2 cards assemble, ~120ms stagger
  tl.fromTo('#root[data-composition-id="05-cobrar"] .cobrar-card',
    { opacity: 0, y: 52, scale: 0.9 },
    { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: 'power3.out', stagger: 0.12 }, 1.0);

  // Scene 3 (2.4-4.5) — cobalt QR grows in the centre of the grid
  tl.fromTo(qr, { opacity: 0, scale: 0.55 },
    { opacity: 1, scale: 1, duration: 0.45, ease: 'back.out(1.5)' }, 2.4);
  tl.fromTo(mods, { opacity: 0, scale: 0.4 },
    { opacity: 1, scale: 1, duration: 0.26, ease: 'power2.out', stagger: 0.004 }, 2.5);

  // COBRADO pill + self-drawing check
  tl.fromTo('#root[data-composition-id="05-cobrar"] .cobrar-pill',
    { opacity: 0, y: 40, scale: 0.85 },
    { opacity: 1, y: 0, scale: 1, duration: 0.46, ease: 'back.out(1.7)' }, 3.0);
  tl.to(checkPath, { strokeDashoffset: 0, duration: 0.36, ease: 'power2.inOut' }, 3.3);

  // hold to 4.5
  tl.to({}, { duration: 0.5 }, 4.0);

  window.__timelines = window.__timelines || {};
  window.__timelines["05-cobrar"] = tl;
})();
</script>
